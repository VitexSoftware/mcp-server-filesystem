[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-filesystem"
version = "0.1.2"
description = "MCP server exposing Linux filesystem operations (list/read/write/etc.) as tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vítězslav Dvořák", email = "info@vitexsoftware.cz" }]
dependencies = [
    "fastmcp>=4.0.0a2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Filesystems",
]

[project.scripts]
mcp-server-filesystem = "mcp_server_filesystem.server:main"

[project.urls]
Homepage = "https://github.com/VitexSoftware/mcp-server-filesystem"

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
